[pytest]
testpaths = tests
python_files = test_*.py
python_classes = *Tests Test*
python_functions = test_*
addopts = -v --tb=short -p no:cacheprovider -m "not integration"
norecursedirs = tests/manual
markers =
    slow: marks tests as slow
    integration: marks tests as integration tests
    asyncio: marks tests as async
    smoke: marks critical fast smoke tests for post-update validation
    jarvis: tests du module Jarvis
    core_intellect: tests du module Core Intellect
    context_engine: tests du module Context Engine
    taskflow: tests du module TaskFlow
    datashield: tests du module DataShield
    syncsphere: tests du module SyncSphere
    progress_tracker: tests du module Progress Tracker
    interface_morphique: tests du module Interface Morphique
    greatos: tests d'intégration GreatOS
