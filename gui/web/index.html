<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jarvis</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --page: #05050a;
      --chat: #0a0a0f;
      --header: #0a0a0f;
      --footer: #08080d;
      --border: #111827;
      --text: #a8b8c8;
      --muted: #6f8194;
      --input-bg: #0c1018;
      --input-border: #1a2a3a;
      --input-text: #7a9ab8;
      --button: #0c2a44;
      --user-bg: #0d2a44;
      --user-border: #1a4a6a;
      --user-text: #8ab8d8;
      --jarvis-bg: #0d0d14;
      --jarvis-border: #1a2030;
      --jarvis-text: #a8b8c8;
    }

    body.light {
      --page: #e8edf3;
      --chat: #f8fafc;
      --header: #0a0a0f;
      --footer: #eef3f8;
      --border: #cad4df;
      --text: #263746;
      --muted: #587083;
      --input-bg: #ffffff;
      --input-border: #b8c7d8;
      --input-text: #23384d;
      --button: #1a4a6a;
      --user-bg: #d8ebfb;
      --user-border: #8ab8d8;
      --user-text: #0d2a44;
      --jarvis-bg: #ffffff;
      --jarvis-border: #cad4df;
      --jarvis-text: #263746;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--page);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 18px;
    }

    .chat {
      width: min(100%, 720px);
      height: calc(100vh - 36px);
      background: var(--chat);
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      min-height: 0;
    }

    header {
      flex: 0 0 auto;
      padding: 18px 20px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--header);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 2;
    }

    .brand {
      display: flex;
      flex-direction: column;
      line-height: 1.05;
    }

    .title {
      color: #fff;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .subtitle {
      color: #3a6a9a;
      font-family: "Edwardian Script ITC", "Brush Script MT", cursive;
      font-size: 16px;
      font-style: italic;
      margin-top: 3px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #1a6a3a;
      box-shadow: 0 0 0 0 rgba(26, 106, 58, 0.8);
      animation: pulse 1.4s infinite;
      flex: 0 0 auto;
    }

    .dot.offline {
      background: #6a1a1a;
      animation: none;
      box-shadow: none;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(26, 106, 58, 0.75); }
      70% { box-shadow: 0 0 0 9px rgba(26, 106, 58, 0); }
      100% { box-shadow: 0 0 0 0 rgba(26, 106, 58, 0); }
    }

    .icon-button {
      width: 42px;
      height: 42px;
      border: 1px solid #16405f;
      background: var(--button);
      color: #fff;
      border-radius: 8px;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      flex: 0 0 auto;
    }

    main {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 18px;
      scroll-behavior: smooth;
      background: var(--chat);
    }

    .row {
      display: flex;
      flex-direction: column;
      margin: 10px 0;
    }

    .row.user {
      align-items: flex-end;
    }

    .row.jarvis {
      align-items: flex-start;
    }

    .label {
      color: var(--muted);
      font-size: 12px;
      margin: 0 8px 4px;
    }

    .bubble {
      max-width: min(82%, 560px);
      padding: 11px 13px;
      border-radius: 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 15px;
      line-height: 1.45;
    }

    .user .bubble {
      background: var(--user-bg);
      border: 1px solid var(--user-border);
      color: var(--user-text);
    }

    .jarvis .bubble {
      background: var(--jarvis-bg);
      border: 1px solid var(--jarvis-border);
      color: var(--jarvis-text);
    }

    .event {
      margin: 8px 0;
      padding: 9px 11px;
      border-radius: 6px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 1.4;
    }

    .event.status-line {
      color: #2a4a6a;
      font-style: italic;
      padding-left: 3px;
    }

    .event.provider {
      color: #1a6a3a;
      padding-left: 3px;
    }

    .event.stark-start {
      background: #1a0a0a;
      border: 1px solid #5a1a1a;
      color: #e0b8b8;
    }

    .event.stark-action {
      margin-left: 24px;
      background: #1a4a1a;
      color: #d5ecd5;
    }

    .event.stark-action.error {
      background: #4a1a1a;
      color: #ffd0d0;
    }

    .event.stark-end {
      background: #0a1a0a;
      border: 1px solid #1a4a1a;
      color: #d8ead8;
    }

    .event.stark-end.interrupted {
      background: #1a0f00;
      border-color: #5a3a1a;
      color: #f0d0a8;
    }

    .event.error {
      color: #ff4444;
      padding-left: 3px;
    }

    footer {
      flex: 0 0 auto;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      padding: 14px;
      border-top: 1px solid var(--border);
      background: var(--footer);
      z-index: 2;
    }

    textarea {
      flex: 1;
      min-width: 0;
      min-height: 48px;
      max-height: 160px;
      height: 48px;
      resize: none;
      overflow-y: auto;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--input-text);
      padding: 12px 13px;
      border-radius: 8px;
      font: 15px/1.45 "Segoe UI", Arial, sans-serif;
      outline: none;
    }

    textarea::placeholder {
      color: #526b82;
    }

    textarea:disabled,
    button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    #cancelButton {
      display: none;
      background: #4a1a1a;
      border-color: #6a2222;
    }

    body.streaming #cancelButton {
      display: block;
    }

    @media (max-width: 560px) {
      body {
        padding: 0;
      }

      .chat {
        width: 100%;
        height: 100vh;
        border-left: 0;
        border-right: 0;
      }

      header {
        padding: 14px;
      }

      .status span:last-child {
        display: none;
      }

      main {
        padding: 14px;
      }

      .bubble {
        max-width: 92%;
      }

      footer {
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <section class="chat">
    <header>
      <div class="brand">
        <div class="title">JARVIS</div>
        <div class="subtitle">by Carl-William</div>
      </div>
      <div class="header-actions">
        <div class="status">
          <span id="statusDot" class="dot"></span>
          <span id="statusText">Service en ligne</span>
        </div>
        <button id="themeButton" class="icon-button" type="button" title="Changer le thème">☾</button>
      </div>
    </header>

    <main id="conversation"></main>

    <footer>
      <textarea id="messageInput" placeholder="Entrez votre commande, Sir…" autocomplete="off" rows="1"></textarea>
      <button id="sendButton" class="icon-button" type="button" title="Envoyer">→</button>
      <button id="cancelButton" class="icon-button" type="button" title="Annuler">✕</button>
    </footer>
  </section>

  <script>
    const conversation = document.getElementById("conversation");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const cancelButton = document.getElementById("cancelButton");
    const themeButton = document.getElementById("themeButton");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    let source = null;

    function scrollBottom() {
      conversation.scrollTop = conversation.scrollHeight;
    }

    function appendElement(element) {
      conversation.appendChild(element);
      scrollBottom();
    }

    function addBubble(kind, label, text) {
      const row = document.createElement("div");
      row.className = `row ${kind}`;

      const labelNode = document.createElement("div");
      labelNode.className = "label";
      labelNode.textContent = label;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      row.append(labelNode, bubble);
      appendElement(row);
    }

    function addEvent(className, text) {
      const node = document.createElement("div");
      node.className = `event ${className}`;
      node.textContent = text;
      appendElement(node);
    }

    function resizeTextarea() {
      input.style.height = "48px";
      input.style.height = `${Math.min(input.scrollHeight, 160)}px`;
    }

    function setStreaming(streaming) {
      document.body.classList.toggle("streaming", streaming);
      input.disabled = streaming;
      sendButton.disabled = streaming;
      if (!streaming) {
        input.focus();
      }
    }

    function handleEvent(event) {
      const type = event.type;
      const data = event.data || {};

      if (type === "thinking") {
        addEvent("status-line", data.message || "Jarvis réfléchit...");
      } else if (type === "provider") {
        addEvent("provider", `✓ ${data.provider || "?"} — ${data.model || "?"}`);
      } else if (type === "stark_activated") {
        addEvent("stark-start", `⚡ Mode Stark activé — ${data.objectif || ""}`);
      } else if (type === "stark_action") {
        const result = String(data.resultat || "").slice(0, 120);
        addEvent(`stark-action${data.erreur ? " error" : ""}`, `  ⚡ ${data.outil || "?"} → ${result}`);
      } else if (type === "stark_terminated") {
        const interrupted = data.statut === "interrompu" ? " interrupted" : "";
        addEvent(`stark-end${interrupted}`, data.rapport || "");
      } else if (type === "response") {
        addBubble("jarvis", `Jarvis — ${data.timestamp || ""}`.trim(), data.text || "");
      } else if (type === "error") {
        addEvent("error", data.message || "Erreur inconnue.");
      } else if (type === "done") {
        closeStream(false);
      }
    }

    function closeStream(showMessage = false) {
      if (source) {
        source.close();
        source = null;
      }
      if (showMessage) {
        addEvent("status-line", "Flux interrompu.");
      }
      setStreaming(false);
    }

    function sendMessage() {
      const message = input.value.trim();
      if (!message || source) {
        return;
      }

      input.value = "";
      resizeTextarea();
      addBubble("user", "Vous", message);
      setStreaming(true);

      source = new EventSource(`/jarvis/stream?message=${encodeURIComponent(message)}`);
      source.onmessage = (rawEvent) => {
        try {
          handleEvent(JSON.parse(rawEvent.data));
        } catch (_error) {
          addEvent("error", "Flux SSE illisible.");
        }
      };
      source.onerror = () => {
        addEvent("error", "Connexion au flux interrompue.");
        closeStream(false);
      };
    }

    function applyTheme(theme) {
      document.body.classList.toggle("light", theme === "light");
      themeButton.textContent = theme === "light" ? "☀" : "☾";
      localStorage.setItem("jarvis-theme", theme);
    }

    function toggleTheme() {
      const nextTheme = document.body.classList.contains("light") ? "dark" : "light";
      applyTheme(nextTheme);
    }

    async function refreshStatus() {
      try {
        const response = await fetch("/jarvis/status", { cache: "no-store" });
        if (!response.ok) {
          throw new Error("offline");
        }
        statusDot.classList.remove("offline");
        statusText.textContent = "Service en ligne";
      } catch (_error) {
        statusDot.classList.add("offline");
        statusText.textContent = "Service hors ligne";
      }
    }

    sendButton.addEventListener("click", sendMessage);
    cancelButton.addEventListener("click", () => closeStream(true));
    themeButton.addEventListener("click", toggleTheme);
    input.addEventListener("input", resizeTextarea);
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    applyTheme(localStorage.getItem("jarvis-theme") || "dark");
    resizeTextarea();
    refreshStatus();
    setInterval(refreshStatus, 15000);
    input.focus();
  </script>
</body>
</html>
