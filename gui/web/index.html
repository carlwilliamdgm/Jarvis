<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jarvis</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --page: #05050a;
      --chat: #0a0a0f;
      --header: #0a0a0f;
      --footer: #08080d;
      --border: #111827;
      --text: #a8b8c8;
      --muted: #6f8194;
      --input-bg: #0c1018;
      --input-border: #1a2a3a;
      --input-text: #7a9ab8;
      --button: #0c2a44;
      --user-bg: #0d2a44;
      --user-border: #1a4a6a;
      --user-text: #8ab8d8;
      --jarvis-bg: #0d0d14;
      --jarvis-border: #1a2030;
      --jarvis-text: #a8b8c8;
    }

    body.light {
      --page: #e8edf3;
      --chat: #f8fafc;
      --header: #0a0a0f;
      --footer: #eef3f8;
      --border: #cad4df;
      --text: #263746;
      --muted: #587083;
      --input-bg: #ffffff;
      --input-border: #b8c7d8;
      --input-text: #23384d;
      --button: #1a4a6a;
      --user-bg: #d8ebfb;
      --user-border: #8ab8d8;
      --user-text: #0d2a44;
      --jarvis-bg: #ffffff;
      --jarvis-border: #cad4df;
      --jarvis-text: #263746;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--page);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 18px;
    }

    .chat {
      width: min(100%, 720px);
      height: calc(100vh - 36px);
      height: calc(100dvh - 36px);
      background: var(--chat);
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      min-height: 0;
    }

    header {
      flex: 0 0 auto;
      padding: 18px 20px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--header);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 2;
    }

    .brand {
      display: flex;
      flex-direction: column;
      line-height: 1.05;
    }

    .title {
      color: #fff;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .subtitle {
      color: #3a6a9a;
      font-family: "Edwardian Script ITC", "Brush Script MT", cursive;
      font-size: 16px;
      font-style: italic;
      margin-top: 3px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #1a6a3a;
      box-shadow: 0 0 0 0 rgba(26, 106, 58, 0.8);
      animation: pulse 1.4s infinite;
      flex: 0 0 auto;
    }

    .dot.offline {
      background: #6a1a1a;
      animation: none;
      box-shadow: none;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(26, 106, 58, 0.75); }
      70% { box-shadow: 0 0 0 9px rgba(26, 106, 58, 0); }
      100% { box-shadow: 0 0 0 0 rgba(26, 106, 58, 0); }
    }

    .icon-button {
      width: 42px;
      height: 42px;
      border: 1px solid #16405f;
      background: var(--button);
      color: #fff;
      border-radius: 8px;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .instance-selector {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .instance-select {
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      min-width: 140px;
    }

    .instance-badge {
      background: var(--button);
      color: #fff;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--chat);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: min(90%, 500px);
      max-height: 80vh;
      max-height: 80dvh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 24px;
      cursor: pointer;
      padding: 0;
      width: 32px;
      height: 32px;
    }

    .modal-close:hover {
      color: var(--text);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: var(--muted);
    }

    .form-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--button);
    }

    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      border: none;
    }

    .btn-primary {
      background: var(--button);
      color: #fff;
    }

    .btn-secondary {
      background: var(--muted-button-bg);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-danger {
      background: #6a1a1a;
      color: #ffd0d0;
    }

    .kill-button {
      display: none;
      background: #6a1a1a;
      color: #ffd0d0;
      border: 1px solid #8a2a2a;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .kill-button.visible {
      display: block;
    }

    .instance-list {
      margin-top: 16px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }

    .instance-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: var(--input-bg);
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .instance-item-info {
      flex: 1;
    }

    .instance-item-name {
      font-weight: 600;
      color: var(--text);
    }

    .instance-item-url {
      font-size: 12px;
      color: var(--muted);
    }

    .instance-item-actions {
      display: flex;
      gap: 8px;
    }

    .discovery-section {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .discovery-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .discovery-results {
      margin-top: 12px;
    }

    .discovery-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: var(--input-bg);
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .discovery-item-status {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .discovery-item-status.online {
      background: #1a4a1a;
      color: #d5ecd5;
    }

    .discovery-item-status.offline {
      background: #4a1a1a;
      color: #ffd0d0;
    }

    main {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 18px;
      scroll-behavior: smooth;
      background: var(--chat);
    }

    .row {
      display: flex;
      flex-direction: column;
      margin: 10px 0;
    }

    .row.user {
      align-items: flex-end;
    }

    .row.jarvis {
      align-items: flex-start;
    }

    .label {
      color: var(--muted);
      font-size: 12px;
      margin: 0 8px 4px;
    }

    .bubble {
      max-width: min(82%, 560px);
      padding: 11px 13px;
      border-radius: 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 15px;
      line-height: 1.45;
    }

    .user .bubble {
      background: var(--user-bg);
      border: 1px solid var(--user-border);
      color: var(--user-text);
    }

    .jarvis .bubble {
      background: var(--jarvis-bg);
      border: 1px solid var(--jarvis-border);
      color: var(--jarvis-text);
    }

    .event {
      margin: 8px 0;
      padding: 9px 11px;
      border-radius: 6px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 1.4;
    }

    .event.status-line {
      color: #2a4a6a;
      font-style: italic;
      padding-left: 3px;
    }

    .event.provider {
      color: #1a6a3a;
      padding-left: 3px;
    }

    .event.stark-start {
      background: #1a0a0a;
      border: 1px solid #5a1a1a;
      color: #e0b8b8;
    }

    .event.stark-action {
      margin-left: 24px;
      background: #1a4a1a;
      color: #d5ecd5;
    }

    .event.stark-action.error {
      background: #4a1a1a;
      color: #ffd0d0;
    }

    .event.stark-end {
      background: #0a1a0a;
      border: 1px solid #1a4a1a;
      color: #d8ead8;
    }

    .event.stark-end.interrupted {
      background: #1a0f00;
      border-color: #5a3a1a;
      color: #f0d0a8;
    }

    .event.error {
      color: #ff4444;
      padding-left: 3px;
    }

    footer {
      flex: 0 0 auto;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      padding: 14px;
      border-top: 1px solid var(--border);
      background: var(--footer);
      z-index: 2;
    }

    textarea {
      flex: 1;
      min-width: 0;
      min-height: 48px;
      max-height: 160px;
      height: 48px;
      resize: none;
      overflow-y: auto;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--input-text);
      padding: 12px 13px;
      border-radius: 8px;
      font: 15px/1.45 "Segoe UI", Arial, sans-serif;
      outline: none;
    }

    textarea::placeholder {
      color: #526b82;
    }

    textarea:disabled,
    button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    #cancelButton {
      display: none;
      background: #4a1a1a;
      border-color: #6a2222;
    }

    body.streaming #cancelButton {
      display: block;
    }

    @media (max-width: 560px) {
      body {
        padding: 0;
      }

      .chat {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        border-left: 0;
        border-right: 0;
      }

      header {
        flex-wrap: wrap;
        row-gap: 12px;
        padding: 14px;
      }

      .header-actions {
        width: 100%;
        justify-content: space-between;
        flex-wrap: wrap;
        row-gap: 8px;
      }

      .instance-selector {
        flex: 1 1 auto;
        min-width: 0;
      }

      .instance-select {
        min-width: 0;
        width: 100%;
      }

      .instance-badge {
        flex: 0 0 auto;
      }

      .status span:last-child {
        display: none;
      }

      main {
        padding: 14px;
      }

      .bubble {
        max-width: 92%;
      }

      footer {
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <section class="chat">
    <header>
      <div class="brand">
        <div class="title">JARVIS</div>
        <div class="subtitle">by Carl-William</div>
      </div>
      <div class="header-actions">
        <div class="instance-selector">
          <select id="instanceSelect" class="instance-select" title="Sélectionner l'instance Jarvis"></select>
          <span id="instanceBadge" class="instance-badge"></span>
        </div>
        <button id="killButton" class="kill-button" type="button">Effacer cette instance</button>
        <div class="status">
          <span id="statusDot" class="dot"></span>
          <span id="statusText">Service en ligne</span>
        </div>
        <button id="manageInstancesButton" class="icon-button" type="button" title="Gérer les instances">⚙</button>
        <button id="themeButton" class="icon-button" type="button" title="Changer le thème">☾</button>
      </div>
    </header>

    <main id="conversation"></main>

    <footer>
      <textarea id="messageInput" placeholder="Entrez votre commande, Sir…" autocomplete="off" rows="1"></textarea>
      <button id="sendButton" class="icon-button" type="button" title="Envoyer">→</button>
      <button id="cancelButton" class="icon-button" type="button" title="Annuler">✕</button>
    </footer>
  </section>

  <!-- Instance Management Modal -->
  <div id="instanceModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">Gérer les instances Jarvis</h2>
        <button id="closeModal" class="modal-close">×</button>
      </div>
      
      <div class="form-group">
        <label class="form-label">Nom</label>
        <input type="text" id="newInstanceName" class="form-input" placeholder="Ex: PC2">
      </div>
      
      <div class="form-group">
        <label class="form-label">URL</label>
        <input type="text" id="newInstanceUrl" class="form-input" placeholder="http://100.x.x.x:8000">
      </div>
      
      <div style="display: flex; gap: 8px; margin-bottom: 16px;">
        <button id="testConnection" class="btn btn-secondary">Tester la connexion</button>
        <button id="addInstance" class="btn btn-primary">Ajouter</button>
      </div>
      
      <div class="instance-list" id="instanceList"></div>
      
      <div class="discovery-section">
        <div class="discovery-toggle">
          <button id="discoveryButton" class="btn btn-secondary" type="button">Découverte réseau Tailscale</button>
        </div>
        <div id="discoveryResults" class="discovery-results"></div>
      </div>
    </div>
  </div>

  <script>
    const conversation = document.getElementById("conversation");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const cancelButton = document.getElementById("cancelButton");
    const themeButton = document.getElementById("themeButton");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const instanceSelect = document.getElementById("instanceSelect");
    const instanceBadge = document.getElementById("instanceBadge");
    const killButton = document.getElementById("killButton");
    const manageInstancesButton = document.getElementById("manageInstancesButton");
    const instanceModal = document.getElementById("instanceModal");
    const closeModal = document.getElementById("closeModal");
    const newInstanceName = document.getElementById("newInstanceName");
    const newInstanceUrl = document.getElementById("newInstanceUrl");
    const testConnection = document.getElementById("testConnection");
    const addInstance = document.getElementById("addInstance");
    const instanceList = document.getElementById("instanceList");
    const discoveryButton = document.getElementById("discoveryButton");
    const discoveryResults = document.getElementById("discoveryResults");
    let discoveryActive = false;
    
    let source = null;
    let apiBase = window.location.origin;
    let instances = [];
    const localInstanceId = "local";
    const localInstance = { id: localInstanceId, nom: "Local", url: window.location.origin };
    let activeInstanceId = localInstanceId;
    let editingInstanceId = null;

    function scrollBottom() {
      conversation.scrollTop = conversation.scrollHeight;
    }

    function appendElement(element) {
      conversation.appendChild(element);
      scrollBottom();
    }

    function addBubble(kind, label, text) {
      const row = document.createElement("div");
      row.className = `row ${kind}`;

      const labelNode = document.createElement("div");
      labelNode.className = "label";
      labelNode.textContent = label;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      row.append(labelNode, bubble);
      appendElement(row);
    }

    function addEvent(className, text) {
      const node = document.createElement("div");
      node.className = `event ${className}`;
      node.textContent = text;
      appendElement(node);
    }

    function resizeTextarea() {
      input.style.height = "48px";
      input.style.height = `${Math.min(input.scrollHeight, 160)}px`;
    }

    function setStreaming(streaming) {
      document.body.classList.toggle("streaming", streaming);
      input.disabled = streaming;
      sendButton.disabled = streaming;
      if (!streaming) {
        input.focus();
      }
    }

    function handleEvent(event) {
      const type = event.type;
      const data = event.data || {};

      if (type === "thinking") {
        addEvent("status-line", data.message || "Jarvis réfléchit...");
      } else if (type === "provider") {
        addEvent("provider", `✓ ${data.provider || "?"} — ${data.model || "?"}`);
      } else if (type === "stark_activated") {
        addEvent("stark-start", `⚡ Mode Stark activé — ${data.objectif || ""}`);
      } else if (type === "stark_action") {
        const result = String(data.resultat || "").slice(0, 120);
        addEvent(`stark-action${data.erreur ? " error" : ""}`, `  ⚡ ${data.outil || "?"} → ${result}`);
      } else if (type === "stark_terminated") {
        const interrupted = data.statut === "interrompu" ? " interrupted" : "";
        addEvent(`stark-end${interrupted}`, data.rapport || "");
      } else if (type === "response") {
        addBubble("jarvis", `Jarvis — ${data.timestamp || ""}`.trim(), data.text || "");
      } else if (type === "error") {
        addEvent("error", data.message || "Erreur inconnue.");
      } else if (type === "done") {
        closeStream(false);
      }
    }

    function closeStream(showMessage = false) {
      if (source) {
        source.close();
        source = null;
      }
      if (showMessage) {
        addEvent("status-line", "Flux interrompu.");
      }
      setStreaming(false);
    }

    function sendMessage() {
      const message = input.value.trim();
      if (!message || source) {
        return;
      }

      input.value = "";
      resizeTextarea();
      addBubble("user", "Vous", message);
      setStreaming(true);

      source = new EventSource(`${apiBase}/jarvis/stream?message=${encodeURIComponent(message)}`);
      source.onmessage = (rawEvent) => {
        try {
          handleEvent(JSON.parse(rawEvent.data));
        } catch (_error) {
          addEvent("error", "Flux SSE illisible.");
        }
      };
      source.onerror = () => {
        addEvent("error", "Connexion au flux interrompue.");
        closeStream(false);
      };
    }

    function applyTheme(theme) {
      document.body.classList.toggle("light", theme === "light");
      themeButton.textContent = theme === "light" ? "☀" : "☾";
      localStorage.setItem("jarvis-theme", theme);
    }

    function toggleTheme() {
      const nextTheme = document.body.classList.contains("light") ? "dark" : "light";
      applyTheme(nextTheme);
    }

    async function refreshStatus() {
      try {
        const response = await fetch(`${apiBase}/jarvis/status`, { cache: "no-store" });
        if (!response.ok) {
          throw new Error("offline");
        }
        statusDot.classList.remove("offline");
        statusText.textContent = "Service en ligne";
      } catch (_error) {
        statusDot.classList.add("offline");
        statusText.textContent = "Service hors ligne";
      }
    }

    // Instance Management Functions
    function loadInstances() {
      const saved = localStorage.getItem("jarvis-instances");
      if (saved) {
        instances = JSON.parse(saved);
      } else {
        instances = [
          { ...localInstance }
        ];
      }
      if (!instances.some(inst => inst.id === localInstanceId)) {
        instances.unshift({ ...localInstance });
      }
      activeInstanceId = localStorage.getItem("jarvis-active-instance") || localInstanceId;
      if (!instances.some(inst => inst.id === activeInstanceId)) {
        activeInstanceId = localInstanceId;
      }
      updateInstanceUI();
    }

    function saveInstances() {
      localStorage.setItem("jarvis-instances", JSON.stringify(instances));
      localStorage.setItem("jarvis-active-instance", activeInstanceId);
    }

    function isLocalhost(url) {
      try {
        const parsed = new URL(url);
        const hostname = parsed.hostname.toLowerCase();
        return hostname === "localhost" || hostname === "127.0.0.1";
      } catch {
        return false;
      }
    }

    function updateInstanceUI() {
      instanceSelect.innerHTML = "";
      instances.forEach(inst => {
        const option = document.createElement("option");
        option.value = inst.id;
        option.textContent = inst.nom;
        option.selected = inst.id === activeInstanceId;
        instanceSelect.appendChild(option);
      });
      
      const activeInstance = instances.find(i => i.id === activeInstanceId);
      if (activeInstance) {
        instanceBadge.textContent = activeInstance.nom;
        apiBase = activeInstance.url;
        document.title = `Jarvis — ${activeInstance.nom}`;
        
        // Show/hide kill button based on whether it's a remote instance
        if (isLocalhost(activeInstance.url)) {
          killButton.classList.remove("visible");
        } else {
          killButton.classList.add("visible");
        }
      }
    }

    function switchInstance(instanceId) {
      activeInstanceId = instanceId;
      const instance = instances.find(i => i.id === instanceId);
      if (instance) {
        apiBase = instance.url;
        saveInstances();
        updateInstanceUI();
        refreshStatus();
      }
    }

    function renderInstanceList() {
      instanceList.innerHTML = "";
      instances.forEach(inst => {
        const item = document.createElement("div");
        item.className = "instance-item";
        
        const info = document.createElement("div");
        info.className = "instance-item-info";
        
        const name = document.createElement("div");
        name.className = "instance-item-name";
        name.textContent = inst.nom;
        
        const url = document.createElement("div");
        url.className = "instance-item-url";
        url.textContent = inst.url;
        
        info.appendChild(name);
        info.appendChild(url);
        
        const actions = document.createElement("div");
        actions.className = "instance-item-actions";
        
        if (inst.id !== localInstanceId) {
          const editBtn = document.createElement("button");
          editBtn.className = "btn btn-secondary";
          editBtn.textContent = "Modifier";
          editBtn.onclick = () => editInstance(inst.id);
          
          const deleteBtn = document.createElement("button");
          deleteBtn.className = "btn btn-danger";
          deleteBtn.textContent = "Supprimer";
          deleteBtn.onclick = () => deleteInstance(inst.id);
          
          actions.appendChild(editBtn);
          actions.appendChild(deleteBtn);
        }
        
        item.appendChild(info);
        item.appendChild(actions);
        instanceList.appendChild(item);
      });
    }

    function generateId() {
      return "inst-" + Math.random().toString(36).substr(2, 9);
    }

    function validateUrl(url) {
      try {
        const parsed = new URL(url);
        return parsed.protocol === "http:" || parsed.protocol === "https:";
      } catch {
        return false;
      }
    }

    async function testInstanceConnection(url) {
      try {
        const response = await fetch(`${url}/jarvis/status`, { cache: "no-store", signal: AbortSignal.timeout(5000) });
        return response.ok;
      } catch {
        return false;
      }
    }

    function addOrUpdateInstance() {
      const name = newInstanceName.value.trim();
      const url = newInstanceUrl.value.trim();
      
      if (!name || !url) {
        alert("Veuillez remplir le nom et l'URL");
        return;
      }
      
      if (!validateUrl(url)) {
        alert("URL invalide (doit commencer par http:// ou https://)");
        return;
      }
      
      if (editingInstanceId) {
        const inst = instances.find(i => i.id === editingInstanceId);
        if (inst) {
          inst.nom = name;
          inst.url = url;
        }
        editingInstanceId = null;
        addInstance.textContent = "Ajouter";
      } else {
        const newInst = {
          id: generateId(),
          nom: name,
          url: url
        };
        instances.push(newInst);
      }
      
      saveInstances();
      updateInstanceUI();
      renderInstanceList();
      newInstanceName.value = "";
      newInstanceUrl.value = "";
    }

    function editInstance(id) {
      const inst = instances.find(i => i.id === id);
      if (inst) {
        editingInstanceId = id;
        newInstanceName.value = inst.nom;
        newInstanceUrl.value = inst.url;
        addInstance.textContent = "Mettre à jour";
      }
    }

    function deleteInstance(id) {
      if (confirm("Supprimer cette instance ?")) {
        instances = instances.filter(i => i.id !== id);
        if (activeInstanceId === id) {
          activeInstanceId = localInstanceId;
        }
        saveInstances();
        updateInstanceUI();
        renderInstanceList();
      }
    }

    function setDiscoveryButtonState() {
      discoveryButton.classList.toggle("btn-primary", discoveryActive);
      discoveryButton.classList.toggle("btn-secondary", !discoveryActive);
      discoveryButton.textContent = discoveryActive
        ? "Arrêter la découverte"
        : "Découverte réseau Tailscale";
    }

    async function discoverNetwork() {
      if (!discoveryActive) {
        discoveryResults.innerHTML = "";
        return;
      }
      
      discoveryResults.innerHTML = "<div style='color: var(--muted);'>Recherche en cours...</div>";
      
      try {
        const response = await fetch(`${apiBase}/jarvis/discover`);
        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.detail || "Erreur de découverte");
        }
        
        const data = await response.json();
        const devices = data.devices || [];
        
        if (devices.length === 0) {
          discoveryResults.innerHTML = "<div style='color: var(--muted);'>Aucun appareil détecté</div>";
          return;
        }
        
        discoveryResults.innerHTML = "";
        
        for (const device of devices) {
          const item = document.createElement("div");
          item.className = "discovery-item";
          
          const info = document.createElement("div");
          info.innerHTML = `<strong>${device.nom}</strong><br><small>${device.ip}</small>`;
          
          const status = document.createElement("span");
          status.className = "discovery-item-status";
          status.textContent = "Test...";
          
          const actions = document.createElement("div");
          
          item.appendChild(info);
          item.appendChild(status);
          item.appendChild(actions);
          discoveryResults.appendChild(item);
          
          // Test if Jarvis is running on port 8000
          const jarvisUrl = `http://${device.ip}:8000`;
          const isOnline = await testInstanceConnection(jarvisUrl);
          
          status.className = `discovery-item-status ${isOnline ? "online" : "offline"}`;
          status.textContent = isOnline ? "Jarvis actif" : "Hors ligne";
          
          if (isOnline) {
            const addBtn = document.createElement("button");
            addBtn.className = "btn btn-primary";
            addBtn.textContent = "Ajouter";
            addBtn.style.fontSize = "12px";
            addBtn.style.padding = "4px 8px";
            addBtn.onclick = () => {
              newInstanceName.value = device.nom;
              newInstanceUrl.value = jarvisUrl;
              discoveryActive = false;
              setDiscoveryButtonState();
              discoveryResults.innerHTML = "";
            };
            actions.appendChild(addBtn);
          }
        }
      } catch (error) {
        discoveryResults.innerHTML = `<div style='color: #ff4444;'>Erreur: ${error.message}</div>`;
      }
    }

    // Event Listeners for Instance Management
    instanceSelect.addEventListener("change", (e) => switchInstance(e.target.value));
    manageInstancesButton.addEventListener("click", () => {
      renderInstanceList();
      instanceModal.classList.add("active");
    });
    closeModal.addEventListener("click", () => {
      instanceModal.classList.remove("active");
      editingInstanceId = null;
      addInstance.textContent = "Ajouter";
      newInstanceName.value = "";
      newInstanceUrl.value = "";
    });
    testConnection.addEventListener("click", async () => {
      const url = newInstanceUrl.value.trim();
      if (!url) {
        alert("Veuillez entrer une URL");
        return;
      }
      const isOnline = await testInstanceConnection(url);
      alert(isOnline ? "Connexion réussie !" : "Connexion échouée");
    });
    addInstance.addEventListener("click", addOrUpdateInstance);
    discoveryButton.addEventListener("click", () => {
      discoveryActive = !discoveryActive;
      setDiscoveryButtonState();
      discoverNetwork();
    });

    // Kill button handler
    killButton.addEventListener("click", async () => {
      const activeInstance = instances.find(i => i.id === activeInstanceId);
      if (!activeInstance) return;

      const confirmed = confirm(
        `Effacer définitivement l'instance ${activeInstance.nom} ? Cette action est irréversible.`
      );

      if (!confirmed) return;

      try {
        const response = await fetch(`${activeInstance.url}/jarvis/kill`, {
          method: "POST",
          signal: AbortSignal.timeout(10000)
        });

        if (response.ok) {
          addEvent("status-line", "Instance effacée");
          
          // Remove the instance from the list
          instances = instances.filter(i => i.id !== activeInstanceId);
          
          // Switch to localhost
          activeInstanceId = localInstanceId;
          saveInstances();
          updateInstanceUI();
          refreshStatus();
        } else {
          addEvent("error", "Erreur lors de l'effacement de l'instance");
        }
      } catch (error) {
        addEvent("error", "Impossible de joindre l'instance — vérifier Tailscale");
      }
    });

    sendButton.addEventListener("click", sendMessage);
    cancelButton.addEventListener("click", () => closeStream(true));
    themeButton.addEventListener("click", toggleTheme);
    input.addEventListener("input", resizeTextarea);
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    loadInstances();
    applyTheme(localStorage.getItem("jarvis-theme") || "dark");
    resizeTextarea();
    refreshStatus();
    setInterval(refreshStatus, 15000);
    input.focus();
  </script>
</body>
</html>
